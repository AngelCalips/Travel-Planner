<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Co-Planner • Pastel Edition</title>
  
  <!-- Font morbidi da Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            title: ['Comfortaa', 'sans-serif'],
            sans: ['Quicksand', 'sans-serif']
          },
          colors: {
            pastelSage: '#d8e2dc',
            pastelPeach: '#ffe5d9',
            pastelPink: '#ffcad4',
            pastelLavender: '#dcd6f7',
            pastelCream: '#faf9f6',
            pastelBlue: '#d0e1fd'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
    }
    h1, h2, h3, h4, .font-title {
      font-family: 'Comfortaa', cursive, sans-serif;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .print-card { break-inside: avoid; border: 1px solid #e5e7eb !important; box-shadow: none !important; }
    }
  </style>
</head>
<body class="bg-pastelCream text-stone-700 min-h-screen p-4 sm:p-8 font-sans antialiased">
  <div class="max-w-2xl mx-auto space-y-6">

    <!-- Header -->
    <header class="text-center space-y-3">
      <div class="inline-block bg-pastelLavender px-4 py-1.5 rounded-full text-xs font-semibold text-stone-700 shadow-xs">
        ✨ Travel Organizer Intelligente
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-stone-800" id="tripTitle">I Tuoi Prossimi Passi ✈️</h1>
      
      <!-- Toolbar Azioni Condivisione / PDF / Reset -->
      <div class="no-print flex flex-wrap items-center justify-center gap-2 pt-1">
        <button onclick="shareTrip()" class="flex items-center gap-1.5 bg-white border border-pastelSage px-3.5 py-1.5 rounded-2xl text-xs font-semibold hover:bg-pastelSage/40 transition shadow-xs">
          🔗 <span>Copia Link Condiviso</span>
        </button>
        <button onclick="exportPDF()" class="flex items-center gap-1.5 bg-white border border-pastelPeach px-3.5 py-1.5 rounded-2xl text-xs font-semibold hover:bg-pastelPeach/50 transition shadow-xs">
          📄 <span>Scarica PDF</span>
        </button>
        <button onclick="resetAllData()" class="flex items-center gap-1.5 bg-white border border-rose-200 text-rose-500 px-3.5 py-1.5 rounded-2xl text-xs font-semibold hover:bg-rose-50 transition shadow-xs">
          🔄 <span>Reset Totale</span>
        </button>
      </div>
    </header>

    <!-- Modulo Configurazione Viaggio (no-print) -->
    <section class="no-print bg-white/90 backdrop-blur-sm border border-pastelSage/60 p-5 rounded-3xl shadow-sm space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold uppercase tracking-wider text-stone-500">Pianifica Nuovo Viaggio</h2>
        <button onclick="toggleApiKeyInput()" class="text-xs text-stone-400 hover:text-stone-600 underline">Chiave Gemini (Opzionale)</button>
      </div>

      <!-- Input Chiave API (nascosto di default) -->
      <div id="apiKeySection" class="hidden bg-stone-50 p-3.5 rounded-2xl border border-stone-200">
        <label class="block text-xs font-medium text-stone-600 mb-1">Google Gemini API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="Incolla la tua chiave API se vuoi chiamate AI live" 
               class="w-full bg-white border border-stone-200 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pastelLavender">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">Destinazione</label>
          <input type="text" id="destInput" placeholder="Es. Londra, Tokyo, Edimburgo..." 
                 class="w-full bg-pastelSage/20 border border-pastelSage rounded-2xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pastelPink">
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">Esperienza sul posto</label>
          <select id="typeInput" class="w-full bg-pastelSage/20 border border-pastelSage rounded-2xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pastelPink">
            <option value="first">Prima volta (Luoghi iconici & Classici)</option>
            <option value="returning">Ritorno (Angoli pittoreschi & Meno turistici)</option>
          </select>
        </div>
      </div>

      <!-- Date e Orari -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-pastelCream/60 p-3 rounded-2xl border border-pastelSage/40">
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">Arrivo sul posto</label>
          <div class="flex gap-2">
            <input type="date" id="startDate" class="w-2/3 bg-white border border-pastelSage rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pastelPink">
            <input type="time" id="startTime" value="10:00" class="w-1/3 bg-white border border-pastelSage rounded-xl px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pastelPink">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">Partenza / Rientro</label>
          <div class="flex gap-2">
            <input type="date" id="endDate" class="w-2/3 bg-white border border-pastelSage rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pastelPink">
            <input type="time" id="endTime" value="18:00" class="w-1/3 bg-white border border-pastelSage rounded-xl px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pastelPink">
          </div>
        </div>
      </div>

      <!-- Attività già prenotate -->
      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">Eventi o Attrazioni già prenotate (Orari vincolati)</label>
        <textarea id="bookedEventsInput" rows="2" placeholder="Es. Giorno 1: Biglietto Museo alle 11:30 | Giorno 2: Cena a Soho alle 20:00..." 
                  class="w-full bg-pastelSage/20 border border-pastelSage rounded-2xl px-3.5 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-pastelPink"></textarea>
      </div>

      <!-- Interessi -->
      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">Interessi, Fandom & Preferenze</label>
        <input type="text" id="interestsInput" placeholder="Es. Harry Potter, Sherlock, Mercatini vintage, Dark Academia, Pub storici..." 
               class="w-full bg-pastelSage/20 border border-pastelSage rounded-2xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pastelPink">
      </div>

      <button id="generateBtn" onclick="requestItineraryProposal()" class="w-full bg-pastelLavender hover:bg-pastelPink text-stone-800 font-semibold py-3 rounded-2xl shadow-xs transition duration-200">
        ✨ Proponi Mete & Itinerario con AI
      </button>
    </section>

    <!-- Modal / Box di Revisione e Conferma Proposta AI (no-print) -->
    <section id="reviewModal" class="hidden no-print bg-white border-2 border-pastelLavender p-5 rounded-3xl shadow-md space-y-4">
      <div class="flex items-center gap-2">
        <span class="text-xl">💬</span>
        <div>
          <h3 class="font-bold text-stone-800 text-sm">L'AI ti chiede: "Cosa ne pensi di queste mete?"</h3>
          <p class="text-xs text-stone-500">Dai un'occhiata alle tappe pensate per i tuoi orari e preferenze prima di confermarle.</p>
        </div>
      </div>

      <div id="proposalList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
        <!-- Lista anteprima proposta -->
      </div>

      <div class="flex flex-col sm:flex-row gap-2 pt-2 border-t border-stone-100">
        <button onclick="confirmProposal()" class="flex-1 bg-pastelSage hover:bg-emerald-200 text-stone-800 font-semibold py-2.5 rounded-xl text-xs transition">
          ✅ Perfetto, Conferma e Aggiungi all'Itinerario
        </button>
        <button onclick="cancelProposal()" class="bg-stone-100 hover:bg-stone-200 text-stone-600 font-semibold px-4 py-2.5 rounded-xl text-xs transition">
          Annulla / Modifica Parametri
        </button>
      </div>
    </section>

    <!-- Scheda Itinerario Finale -->
    <section class="space-y-4">
      <div class="flex items-center justify-between px-2">
        <h2 class="text-base sm:text-lg font-bold text-stone-800">Tappe & Programma Ufficiale</h2>
        <button onclick="addNewStopPrompt()" class="no-print text-xs bg-pastelPeach hover:bg-pastelPink text-stone-800 font-semibold px-3.5 py-1.5 rounded-2xl transition shadow-xs">
          + Aggiungi Tappa Manuale
        </button>
      </div>

      <div id="itineraryContainer" class="space-y-3">
        <!-- Render dinamico tappe -->
      </div>
    </section>

  </div>

  <script>
    const STORAGE_KEY = 'pastel_travel_data_v3';

    let tripData = {
      title: "",
      destination: "",
      startDate: "",
      startTime: "10:00",
      endDate: "",
      endTime: "18:00",
      bookedEvents: "",
      stops: []
    };

    let pendingProposal = [];

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const sharedData = urlParams.get('trip');

      if (sharedData) {
        try {
          tripData = JSON.parse(decodeURIComponent(escape(atob(sharedData))));
        } catch (e) {
          console.error("Errore lettura link:", e);
        }
      } else {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try { tripData = JSON.parse(saved); } catch(e){}
        }
      }
      renderItinerary();
    });

    function renderItinerary() {
      const titleElem = document.getElementById('tripTitle');
      if (tripData.destination && tripData.destination.trim() !== "") {
        titleElem.innerText = tripData.title || `Viaggio a ${tripData.destination}`;
      } else {
        titleElem.innerText = "I Tuoi Prossimi Passi ✈️";
      }

      const container = document.getElementById('itineraryContainer');
      container.innerHTML = '';

      if (!tripData.stops || tripData.stops.length === 0) {
        container.innerHTML = `
          <div class="bg-white/80 p-8 rounded-3xl text-center space-y-2 border border-dashed border-pastelSage">
            <p class="text-stone-600 font-medium text-sm">Nessuna tappa inserita per ora 🌸</p>
            <p class="text-xs text-stone-400">Inserisci orari, prenotazioni e preferenze sopra e clicca su "Proponi Mete & Itinerario con AI".</p>
          </div>
        `;
        return;
      }

      const daysMap = {};
      tripData.stops.forEach(stop => {
        const d = stop.day || "Generale";
        if (!daysMap[d]) daysMap[d] = [];
        daysMap[d].push(stop);
      });

      for (const [dayName, stops] of Object.entries(daysMap)) {
        const dayHeader = document.createElement('div');
        dayHeader.className = "pt-3 pb-1 flex items-center gap-2";
        dayHeader.innerHTML = `<span class="h-2.5 w-2.5 rounded-full bg-pastelPink"></span><h3 class="text-sm font-bold uppercase tracking-wider text-stone-600">${dayName}</h3>`;
        container.appendChild(dayHeader);

        stops.forEach((stop) => {
          const originalIndex = tripData.stops.findIndex(s => s.id === stop.id);
          const card = document.createElement('div');
          card.className = "print-card bg-white border border-stone-100 p-4 rounded-3xl shadow-xs space-y-1.5 transition";
          
          const isBooked = stop.isBooked ? `<span class="bg-rose-100 text-rose-700 px-2.5 py-0.5 rounded-full font-bold text-[10px]">🎟️ Prenotato</span>` : '';

          card.innerHTML = `
            <div class="flex justify-between items-center text-xs">
              <div class="flex items-center gap-2">
                <span class="font-semibold text-stone-400 uppercase tracking-wide">${stop.time}</span>
                ${isBooked}
              </div>
              <span class="bg-${stop.color || 'pastelSage'} px-3 py-0.5 rounded-full font-semibold text-stone-700 text-[11px]">${stop.tag || 'Tappa'}</span>
            </div>
            <h4 class="font-bold text-stone-800 text-base leading-snug">${stop.title}</h4>
            <p class="text-xs text-stone-600 leading-relaxed">${stop.desc}</p>
            <div class="no-print flex justify-end gap-3 pt-2 border-t border-stone-50 text-xs">
              <button onclick="editStop(${originalIndex})" class="text-stone-500 hover:text-stone-800 font-semibold">✏️ Modifica</button>
              <button onclick="deleteStop(${originalIndex})" class="text-rose-400 hover:text-rose-600 font-semibold">🗑️ Elimina</button>
            </div>
          `;
          container.appendChild(card);
        });
      }

      saveLocally();
    }

    function saveLocally() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tripData));
    }

    function resetAllData() {
      if (confirm("Sei sicuro di voler resettare completamente l'itinerario? Tutti i dati e le tappe correnti verranno cancellati.")) {
        localStorage.removeItem(STORAGE_KEY);
        tripData = {
          title: "",
          destination: "",
          startDate: "",
          startTime: "10:00",
          endDate: "",
          endTime: "18:00",
          bookedEvents: "",
          stops: []
        };
        // Reset form
        document.getElementById('destInput').value = '';
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        document.getElementById('bookedEventsInput').value = '';
        document.getElementById('interestsInput').value = '';
        cancelProposal();
        renderItinerary();
      }
    }

    function shareTrip() {
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(tripData))));
      const shareUrl = window.location.origin + window.location.pathname + '?trip=' + encoded;
      
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("✨ Link copiato negli appunti!\n\nInvialo ai tuoi compagni di viaggio per vedere e modificare insieme l'itinerario.");
      }).catch(() => {
        prompt("Copia questo link e invialo al tuo gruppo:", shareUrl);
      });
    }

    function addNewStopPrompt() {
      const day = prompt("Giorno (es. Giorno 1, Giorno 2):", "Giorno 1");
      if (!day) return;
      const time = prompt("Fascia oraria / Orario preciso (es. Mattina • 10:30):", "Pomeriggio • 15:00");
      const title = prompt("Nome del luogo / Tappa:");
      if (!title) return;
      const desc = prompt("Dettagli o note logistiche:");
      const tag = prompt("Tag (es. Harry Potter, Sherlock, Food):", "Visita");

      tripData.stops.push({
        id: "stop-" + Date.now(),
        day: day,
        time: time || "Orario libero",
        title: title,
        desc: desc || "",
        tag: tag || "Tappa",
        color: "pastelBlue",
        isBooked: false
      });
      renderItinerary();
    }

    function editStop(index) {
      const stop = tripData.stops[index];
      const newTitle = prompt("Modifica titolo tappa:", stop.title);
      if (newTitle !== null) stop.title = newTitle;
      const newDesc = prompt("Modifica descrizione / note:", stop.desc);
      if (newDesc !== null) stop.desc = newDesc;
      const newTime = prompt("Modifica orario:", stop.time);
      if (newTime !== null) stop.time = newTime;
      renderItinerary();
    }

    function deleteStop(index) {
      if (confirm("Vuoi rimuovere questa tappa dall'itinerario?")) {
        tripData.stops.splice(index, 1);
        renderItinerary();
      }
    }

    function exportPDF() {
      window.print();
    }

    function toggleApiKeyInput() {
      const el = document.getElementById('apiKeySection');
      el.classList.toggle('hidden');
    }

    // Richiesta proposta (Anteprima AI)
    async function requestItineraryProposal() {
      const dest = document.getElementById('destInput').value.trim();
      const expType = document.getElementById('typeInput').value;
      const sDate = document.getElementById('startDate').value;
      const sTime = document.getElementById('startTime').value || '10:00';
      const eDate = document.getElementById('endDate').value;
      const eTime = document.getElementById('endTime').value || '18:00';
      const booked = document.getElementById('bookedEventsInput').value.trim();
      const interests = document.getElementById('interestsInput').value.trim();
      const apiKey = document.getElementById('apiKeyInput').value.trim();
      const btn = document.getElementById('generateBtn');

      if (!dest) {
        alert("Inserisci una destinazione prima di continuare!");
        return;
      }

      btn.innerText = "⏳ Elaborazione mete su misura...";
      btn.disabled = true;

      tripData.destination = dest;
      tripData.title = `Viaggio a ${dest}`;
      tripData.startDate = sDate;
      tripData.startTime = sTime;
      tripData.endDate = eDate;
      tripData.endTime = eTime;
      tripData.bookedEvents = booked;

      if (apiKey) {
        try {
          const promptText = `Pianifica un itinerario per ${dest}.
Esperienza: ${expType === 'first' ? 'Prima volta (must imperdibili)' : 'Ritorno (luoghi caratteristici, insoliti)'}.
Arrivo sul posto: ${sDate ? sDate : 'Giorno 1'} alle ore ${sTime} (non pianificare prima di quest'ora!).
Partenza/Rientro: ${eDate ? eDate : 'Ultimo giorno'} alle ore ${eTime} (concludi prima di quest'ora!).
Attività già prenotate vincolanti: ${booked || 'Nessuna'}.
Interessi tematici: ${interests || 'Generale'}.

Rispondi ESCLUSIVAMENTE con un array JSON di oggetti con questa struttura esatta:
[
  { "id": "1", "day": "Giorno 1", "time": "Mattina • 10:30", "title": "Nome Luogo", "desc": "Descrizione logistica e metro", "tag": "Tema", "color": "pastelLavender", "isBooked": false }
]
Colori ammessi: pastelLavender, pastelPeach, pastelSage, pastelBlue, pastelPink.`;

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }]
            })
          });

          const data = await response.json();
          const rawText = data.candidates[0].content.parts[0].text;
          const jsonStr = rawText.replace(/```json|```/g, '').trim();
          pendingProposal = JSON.parse(jsonStr);
        } catch (err) {
          console.warn("Chiamata AI fallita, utilizzo fallback intelligente:", err);
          pendingProposal = generateSmartFallback(dest, sTime, eTime, booked, interests);
        }
      } else {
        pendingProposal = generateSmartFallback(dest, sTime, eTime, booked, interests);
      }

      btn.innerText = "✨ Proponi Mete & Itinerario con AI";
      btn.disabled = false;
      showProposalModal(pendingProposal);
    }

    function generateSmartFallback(dest, sTime, eTime, booked, interests) {
      const dLower = dest.toLowerCase();
      const iLower = (interests || '').toLowerCase();
      const list = [];

      // Aggiungi subito l'evento prenotato se presente
      if (booked) {
        list.push({
          id: "bk-1",
          day: "Giorno 1",
          time: "Orario Prenotato",
          title: booked.split('|')[0] || booked,
          desc: "Attività con orario fissato dall'utente.",
          tag: "Prenotato",
          color: "pastelPink",
          isBooked: true
        });
      }

      if (dLower.includes('londra') || dLower.includes('london')) {
        if (iLower.includes('harry potter') || iLower.includes('sherlock')) {
          list.push(
            { id: "1", day: "Giorno 1", time: `Dalle ${sTime} (Arrivo)`, title: "Baker Street & Sherlock Holmes Museum", desc: "Visita al 221B, sosta alle vetrine vittoriane e libreria Daunt Books.", tag: "Sherlock", color: "pastelLavender", isBooked: false },
            { id: "2", day: "Giorno 1", time: "Pomeriggio • 15:00", title: "King's Cross Station & Platform 9 ¾", desc: "Foto con la sciarpa al carrello incastrato e giro allo shop Potter.", tag: "Harry Potter", color: "pastelPeach", isBooked: false },
            { id: "3", day: "Giorno 2", time: "Mattina • 10:00", title: "Warner Bros. Studio Tour London", desc: "Making of Harry Potter: Sala Grande, Diagon Alley e Binario dell'Espresso.", tag: "Harry Potter", color: "pastelPeach", isBooked: false },
            { id: "4", day: "Giorno 2", time: `Pomeriggio (fino alle ${eTime})`, title: "Covent Garden, Cecil Court & Seven Dials", desc: "Passeggiata nel vicolo delle librerie antiche (ispirazione per Diagon Alley).", tag: "Atmosfera", color: "pastelSage", isBooked: false }
          );
        } else {
          list.push(
            { id: "1", day: "Giorno 1", time: `Dalle ${sTime}`, title: "Westminster, Big Ben & Tamigi", desc: "Passeggiata iconica tra le rive del Tamigi e il Parlamento.", tag: "Classico", color: "pastelLavender", isBooked: false },
            { id: "2", day: "Giorno 1", time: `Pomeriggio (entro le ${eTime})`, title: "Covent Garden & Neal's Yard", desc: "Passeggiata nell'iconico cortile colorato e negozietti artigianali.", tag: "Passeggiata", color: "pastelPeach", isBooked: false }
          );
        }
      } else {
        list.push(
          { id: "1", day: "Giorno 1", time: `Dalle ${sTime}`, title: `Esplorazione Centro Storico di ${dest}`, desc: "Passeggiata introduttiva tra i vicoli principali e scorci panoramici.", tag: "Scoperta", color: "pastelLavender", isBooked: false },
          { id: "2", day: "Giorno 1", time: `Pomeriggio (entro le ${eTime})`, title: "Tappa tematica su misura", desc: `Esperienza dedicata a: ${interests || 'Atmosfera e cultura locale'}.`, tag: "Esperienza", color: "pastelPeach", isBooked: false }
        );
      }
      return list;
    }

    function showProposalModal(proposal) {
      const modal = document.getElementById('reviewModal');
      const listCont = document.getElementById('proposalList');
      listCont.innerHTML = '';

      proposal.forEach((item) => {
        const row = document.createElement('div');
        row.className = "p-3 rounded-2xl bg-stone-50 border border-stone-200 text-xs flex justify-between items-center gap-2";
        row.innerHTML = `
          <div>
            <span class="font-bold text-stone-500 uppercase text-[10px]">${item.day} • ${item.time}</span>
            <div class="font-bold text-stone-800">${item.title}</div>
            <div class="text-stone-500 text-[11px]">${item.desc}</div>
          </div>
          <span class="bg-${item.color} px-2 py-0.5 rounded-md font-semibold text-stone-700 whitespace-nowrap text-[10px]">${item.tag}</span>
        `;
        listCont.appendChild(row);
      });

      modal.classList.remove('hidden');
      modal.scrollIntoView({ behavior: 'smooth' });
    }

    function confirmProposal() {
      tripData.stops = [...pendingProposal];
      document.getElementById('reviewModal').classList.add('hidden');
      renderItinerary();
    }

    function cancelProposal() {
      document.getElementById('reviewModal').classList.add('hidden');
    }
  </script>
</body>
</html>
