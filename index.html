<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Co-Planner • Pastel Dashboard</title>
  
  <!-- Font morbidi da Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            title: ['Comfortaa', 'sans-serif'],
            sans: ['Quicksand', 'sans-serif']
          },
          colors: {
            pastelSage: '#d8e2dc',
            pastelPeach: '#ffe5d9',
            pastelPink: '#ffcad4',
            pastelLavender: '#dcd6f7',
            pastelCream: '#faf9f6',
            pastelBlue: '#d0e1fd'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Quicksand', sans-serif; background-color: #faf9f6; }
    h1, h2, h3, h4, .font-title { font-family: 'Comfortaa', cursive, sans-serif; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #faf9f6; }
    ::-webkit-scrollbar-thumb { background: #dcd6f7; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #ffcad4; }

    @media print {
      .no-print { display: none !important; }
      body { background: white !important; padding: 0 !important; }
      .print-area { width: 100% !important; overflow: visible !important; height: auto !important; }
      .print-card { break-inside: avoid; border: 1px solid #e5e7eb !important; box-shadow: none !important; }
    }
  </style>
</head>
<body class="text-stone-700 min-h-screen antialiased flex flex-col">

  <!-- TOP HEADER MOBILE / LOGO -->
  <header class="no-print bg-white/80 backdrop-blur-sm border-b border-pastelSage/40 px-4 py-3 sticky top-0 z-30 flex items-center justify-between shadow-2xs">
    <div class="flex items-center gap-2.5">
      <span class="text-xl">✈️</span>
      <div>
        <h1 class="font-title text-base sm:text-lg font-bold text-stone-800 leading-tight">Travel Co-Planner</h1>
        <p class="text-[10px] text-stone-400 font-medium">Dashboard intelligente per viaggiatori</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <button onclick="shareTrip()" class="flex items-center gap-1.5 bg-pastelLavender hover:bg-pastelPink text-stone-800 px-3 py-1.5 rounded-xl text-xs font-semibold transition shadow-2xs">
        🔗 <span class="hidden sm:inline">Condividi Link</span>
      </button>
      <button onclick="exportPDF()" class="flex items-center gap-1.5 bg-white border border-pastelPeach hover:bg-pastelPeach/50 text-stone-700 px-3 py-1.5 rounded-xl text-xs font-semibold transition shadow-2xs">
        📄 <span class="hidden sm:inline">PDF</span>
      </button>
    </div>
  </header>

  <!-- CONTAINER DASHBOARD A 3 COLONNE -->
  <main class="flex-1 w-full max-w-[1600px] mx-auto p-3 sm:p-5 grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">

    <!-- COLONNA 1 (SX): I MIEI VIAGGI SALVATI (lg:col-span-3) -->
    <aside class="no-print lg:col-span-3 bg-white/90 backdrop-blur-sm border border-pastelLavender/80 p-4 rounded-3xl shadow-xs space-y-3 lg:sticky lg:top-20 lg:max-h-[calc(100vh-100px)] flex flex-col">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-stone-500 flex items-center gap-1.5">
          <span>🧳</span> <span>I Miei Viaggi</span>
        </span>
        <button onclick="createNewTrip()" class="bg-pastelLavender hover:bg-pastelPink text-stone-800 font-bold px-2.5 py-1 rounded-xl text-xs transition shadow-2xs">
          + Nuovo
        </button>
      </div>

      <div id="tripsListContainer" class="space-y-2 flex-1 overflow-y-auto pr-1">
        <!-- Render dinamico card viaggi -->
      </div>
    </aside>

    <!-- COLONNA 2 (CENTRO): GESTORE PARAMETRI & MODIFICHE LIVE (lg:col-span-4) -->
    <section class="no-print lg:col-span-4 bg-white/90 backdrop-blur-sm border border-pastelSage/70 p-4 sm:p-5 rounded-3xl shadow-xs space-y-4 lg:sticky lg:top-20 lg:max-h-[calc(100vh-100px)] overflow-y-auto pr-2">
      <div class="flex justify-between items-center border-b border-stone-100 pb-2">
        <h2 class="text-xs font-bold uppercase tracking-wider text-stone-600 flex items-center gap-1.5">
          <span>⚙️</span> <span>Info di Base & Logistica</span>
        </h2>
        <span class="text-[10px] bg-pastelSage/40 text-stone-600 px-2 py-0.5 rounded-md font-semibold">Auto-save attivo</span>
      </div>

      <!-- Tipologia Viaggio & Livello Esperienza -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1">Tipologia</label>
          <select id="modeSelect" onchange="toggleTripMode(this.value)" class="w-full bg-stone-50 border border-pastelSage rounded-xl px-2.5 py-1.5 text-xs font-semibold text-stone-700 focus:outline-none focus:ring-2 focus:ring-pastelPink">
            <option value="single">🏙️ Città Singola</option>
            <option value="multistop">🚗 Road Trip</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1">Esperienza Meta</label>
          <select id="expTypeSelect" onchange="updateTripField('expType', this.value)" class="w-full bg-stone-50 border border-pastelSage rounded-xl px-2.5 py-1.5 text-xs font-semibold text-stone-700 focus:outline-none focus:ring-2 focus:ring-pastelPink">
            <option value="first">🌟 Prima Volta (Must imperdibili)</option>
            <option value="returning">🌿 Ritorno (Insolito & Pittoresco)</option>
          </select>
        </div>
      </div>

      <!-- SEZIONE CITTÀ SINGOLA -->
      <div id="singleCitySection" class="space-y-2.5">
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">Destinazione</label>
          <input type="text" id="destInput" oninput="updateTripField('destination', this.value)" placeholder="Es. Londra, Edimburgo..." 
                 class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pastelPink">
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">Alloggio / Hotel</label>
          <input type="text" id="hotelInput" oninput="updateTripField('hotel', this.value)" placeholder="Es. The Royale Chulan Hyde Park Hotel..." 
                 class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pastelPink">
        </div>
      </div>

      <!-- SEZIONE MULTI-TAPPA -->
      <div id="multiStopSection" class="hidden space-y-2 bg-pastelCream/80 p-3 rounded-2xl border border-pastelSage/60">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold uppercase tracking-wide text-stone-700">Tappe Percorso</span>
          <button onclick="addStopRouteRow()" class="text-[11px] bg-white text-stone-700 px-2 py-0.5 rounded-lg font-semibold border border-pastelSage hover:bg-pastelSage transition">
            + Tappa
          </button>
        </div>
        <div id="routeStopsList" class="space-y-1.5 max-h-44 overflow-y-auto pr-1"></div>
      </div>

      <!-- LOGISTICA VOLI & DATE -->
      <div class="bg-pastelCream/60 p-3.5 rounded-2xl border border-pastelSage/50 space-y-3">
        <span class="text-xs font-bold uppercase tracking-wide text-stone-700 flex items-center gap-1">
          <span>✈️</span> <span>Voli & Orari Operativi</span>
        </span>

        <div class="space-y-2 text-xs">
          <div>
            <label class="block text-[11px] text-stone-500 font-medium mb-0.5">Arrivo / Andata</label>
            <input type="text" id="airportInput" oninput="updateTripField('airport', this.value)" placeholder="Aeroporto (es. Londra Gatwick)" 
                   class="w-full bg-white border border-stone-200 rounded-lg px-2.5 py-1 text-xs mb-1">
            <div class="flex gap-1.5">
              <input type="date" id="startDate" onchange="updateTripField('startDate', this.value)" class="w-2/3 bg-white border border-stone-200 rounded-lg px-2 py-1 text-xs font-semibold">
              <input type="time" id="startTime" onchange="updateTripField('startTime', this.value)" value="12:30" class="w-1/3 bg-white border border-stone-200 rounded-lg px-1.5 py-1 text-xs">
            </div>
          </div>

          <div>
            <label class="block text-[11px] text-stone-500 font-medium mb-0.5">Rientro / Partenza</label>
            <input type="text" id="returnAirportInput" oninput="updateTripField('returnAirport', this.value)" placeholder="Aeroporto Ritorno (es. Londra Gatwick)" 
                   class="w-full bg-white border border-stone-200 rounded-lg px-2.5 py-1 text-xs mb-1">
            <div class="flex gap-1.5">
              <input type="date" id="endDate" onchange="updateTripField('endDate', this.value)" class="w-2/3 bg-white border border-stone-200 rounded-lg px-2 py-1 text-xs font-semibold">
              <input type="time" id="endTime" onchange="updateTripField('endTime', this.value)" value="17:25" class="w-1/3 bg-white border border-stone-200 rounded-lg px-1.5 py-1 text-xs">
            </div>
          </div>
        </div>
      </div>

      <!-- BIGLIETTI E ORARI FISSI -->
      <div class="bg-pastelPeach/30 p-3 rounded-2xl border border-pastelPeach space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold uppercase tracking-wide text-stone-700">🎟️ Eventi & Biglietti Fissi</span>
          <button onclick="addBookedEventInput()" class="text-[11px] bg-white text-stone-700 px-2 py-0.5 rounded-lg font-semibold border border-pastelPeach hover:bg-pastelPeach transition">
            + Biglietto
          </button>
        </div>
        <div id="bookedEventsList" class="space-y-1.5 max-h-36 overflow-y-auto pr-1"></div>
      </div>

      <!-- INTERESSI -->
      <div>
        <label class="block text-xs font-semibold text-stone-600 mb-1">Interessi & Luoghi Chiave</label>
        <input type="text" id="interestsInput" oninput="updateTripField('interests', this.value)" placeholder="Es. Harry Potter, Sherlock Holmes, Mercatini..." 
               class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-pastelPink">
      </div>

      <!-- PULSANTE CALCOLO -->
      <button id="generateBtn" onclick="requestItineraryProposal()" class="w-full bg-pastelLavender hover:bg-pastelPink text-stone-800 font-bold py-2.5 rounded-2xl shadow-xs transition duration-200 text-xs">
        ✨ Ricalcola Itinerario & Tappe
      </button>
    </section>

    <!-- COLONNA 3 (DX): ITINERARIO UFFICIALE & ANTEPRIMA AI (lg:col-span-5) -->
    <section class="lg:col-span-5 space-y-4 print-area">
      
      <!-- Header Itinerario -->
      <div class="bg-white/80 p-4 rounded-3xl border border-pastelSage/60 shadow-xs flex justify-between items-center">
        <div>
          <span class="text-[10px] font-bold uppercase tracking-wider text-stone-400">Itinerario Attivo</span>
          <h2 class="text-lg font-bold text-stone-800" id="tripTitle">I Tuoi Prossimi Passi ✈️</h2>
        </div>
        <button onclick="addNewStopPrompt()" class="no-print text-xs bg-pastelPeach hover:bg-pastelPink text-stone-800 font-semibold px-3 py-1.5 rounded-xl transition shadow-2xs">
          + Aggiungi Tappa
        </button>
      </div>

      <!-- MODAL DI REVISIONE & SCAMBIO GIORNI -->
      <div id="reviewModal" class="hidden no-print bg-white border-2 border-pastelLavender p-4 rounded-3xl shadow-sm space-y-3">
        <div class="flex justify-between items-center">
          <div class="flex items-center gap-1.5">
            <span>💬</span>
            <h3 class="font-bold text-stone-800 text-xs">Anteprima Mete: Sposta o Conferma!</h3>
          </div>
          <button onclick="swapProposalDaysPrompt()" class="text-[10px] bg-pastelLavender/60 text-stone-700 font-bold px-2 py-1 rounded-lg">
            🔄 Inverti Giorni
          </button>
        </div>
        <div id="proposalList" class="space-y-2 max-h-72 overflow-y-auto pr-1"></div>
        <div class="flex gap-2 pt-1">
          <button onclick="confirmProposal()" class="flex-1 bg-pastelSage hover:bg-emerald-200 text-stone-800 font-bold py-2 rounded-xl text-xs transition">
            ✅ Conferma e Inserisci
          </button>
          <button onclick="cancelProposal()" class="bg-stone-100 hover:bg-stone-200 text-stone-600 px-3 py-2 rounded-xl text-xs font-semibold transition">
            Annulla
          </button>
        </div>
      </div>

      <!-- CONTENITORE ITINERARIO -->
      <div id="itineraryContainer" class="space-y-3"></div>
    </section>

  </main>

  <script>
    const STORAGE_KEY = 'pastel_trips_library_v5';

    let allTrips = {};
    let currentTripId = null;
    let pendingProposal = [];

    function createEmptyTrip(title = "Nuovo Viaggio") {
      return {
        id: "trip-" + Date.now(),
        title: title,
        mode: "single",
        expType: "first", // 'first' o 'returning'
        destination: "Londra",
        hotel: "The Royale Chulan Hyde Park Hotel",
        airport: "Londra Gatwick",
        returnAirport: "Londra Gatwick",
        startDate: "2026-11-14",
        startTime: "12:30",
        endDate: "2026-11-18",
        endTime: "17:25",
        fixedEvents: [
          { day: "16/11/2026", time: "11:30", title: "Harry Potter Studios", isBooked: true }
        ],
        interests: "Harry Potter, Sherlock Holmes",
        routeStops: [],
        stops: []
      };
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const sharedData = urlParams.get('trip');

      loadAllTripsFromStorage();

      if (sharedData) {
        try {
          const importedTrip = JSON.parse(decodeURIComponent(escape(atob(sharedData))));
          if (importedTrip && importedTrip.id) {
            allTrips[importedTrip.id] = importedTrip;
            currentTripId = importedTrip.id;
            saveAllTripsToStorage();
          }
        } catch (e) {
          console.error("Errore lettura link:", e);
        }
      }

      if (Object.keys(allTrips).length === 0) {
        const defaultTrip = createEmptyTrip("Viaggio a Londra");
        allTrips[defaultTrip.id] = defaultTrip;
        currentTripId = defaultTrip.id;
        saveAllTripsToStorage();
      } else if (!currentTripId || !allTrips[currentTripId]) {
        currentTripId = Object.keys(allTrips)[0];
      }

      syncFormWithCurrentTrip();
      renderTripsSidebar();
      renderItinerary();
    });

    function loadAllTripsFromStorage() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { allTrips = JSON.parse(saved); } catch(e){ allTrips = {}; }
      }
    }

    function saveAllTripsToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(allTrips));
    }

    function getCurrentTrip() {
      return allTrips[currentTripId] || null;
    }

    function updateTripField(field, value) {
      const trip = getCurrentTrip();
      if (!trip) return;
      trip[field] = value;
      if (field === 'destination') {
        trip.title = value ? `Viaggio a ${value}` : 'Nuovo Viaggio';
      }
      saveAllTripsToStorage();
      renderTripsSidebar();
      document.getElementById('tripTitle').innerText = trip.title;
    }

    function renderTripsSidebar() {
      const cont = document.getElementById('tripsListContainer');
      cont.innerHTML = '';

      for (const [id, trip] of Object.entries(allTrips)) {
        const isActive = id === currentTripId;
        const card = document.createElement('div');
        card.className = `p-3 rounded-2xl transition border text-xs cursor-pointer flex justify-between items-center ${
          isActive 
            ? 'bg-pastelLavender/40 border-pastelLavender text-stone-800 shadow-2xs font-semibold' 
            : 'bg-white hover:bg-stone-50 border-stone-100 text-stone-600'
        }`;
        
        const badge = trip.mode === 'multistop' 
          ? `<span class="text-[9px] bg-pastelBlue px-2 py-0.5 rounded-full font-bold">🚗 Road Trip</span>` 
          : `<span class="text-[9px] bg-pastelSage px-2 py-0.5 rounded-full font-bold">🏙️ Singola</span>`;

        card.onclick = () => switchTrip(id);
        card.innerHTML = `
          <div class="space-y-0.5 flex-1 pr-2">
            <div class="flex items-center gap-1.5">${badge}</div>
            <div class="font-bold text-stone-800 truncate">${trip.destination || trip.title}</div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="event.stopPropagation(); duplicateTrip('${id}')" title="Duplica" class="p-1 text-stone-400 hover:text-stone-700">📑</button>
            <button onclick="event.stopPropagation(); deleteTrip('${id}')" title="Elimina" class="p-1 text-rose-300 hover:text-rose-600">🗑️</button>
          </div>
        `;
        cont.appendChild(card);
      }
    }

    function switchTrip(id) {
      if (allTrips[id]) {
        currentTripId = id;
        syncFormWithCurrentTrip();
        renderTripsSidebar();
        renderItinerary();
        cancelProposal();
      }
    }

    function createNewTrip() {
      const name = prompt("Nome del nuovo viaggio:", "Nuovo Viaggio");
      if (!name) return;
      const trip = createEmptyTrip(name);
      trip.destination = "";
      trip.hotel = "";
      trip.airport = "";
      trip.returnAirport = "";
      trip.fixedEvents = [];
      trip.stops = [];
      allTrips[trip.id] = trip;
      currentTripId = trip.id;
      saveAllTripsToStorage();
      syncFormWithCurrentTrip();
      renderTripsSidebar();
      renderItinerary();
      cancelProposal();
    }

    function duplicateTrip(id) {
      const src = allTrips[id];
      if (!src) return;
      const dup = JSON.parse(JSON.stringify(src));
      dup.id = "trip-" + Date.now();
      dup.title = src.title + " (Copia)";
      allTrips[dup.id] = dup;
      currentTripId = dup.id;
      saveAllTripsToStorage();
      syncFormWithCurrentTrip();
      renderTripsSidebar();
      renderItinerary();
    }

    function deleteTrip(id) {
      if (confirm("Vuoi eliminare definitivamente questo viaggio?")) {
        delete allTrips[id];
        const keys = Object.keys(allTrips);
        if (keys.length === 0) {
          const fresh = createEmptyTrip("Nuovo Viaggio");
          allTrips[fresh.id] = fresh;
          currentTripId = fresh.id;
        } else {
          currentTripId = keys[0];
        }
        saveAllTripsToStorage();
        syncFormWithCurrentTrip();
        renderTripsSidebar();
        renderItinerary();
        cancelProposal();
      }
    }

    function toggleTripMode(mode) {
      const singleSec = document.getElementById('singleCitySection');
      const multiSec = document.getElementById('multiStopSection');
      if (mode === 'multistop') {
        singleSec.classList.add('hidden');
        multiSec.classList.remove('hidden');
      } else {
        singleSec.classList.remove('hidden');
        multiSec.classList.add('hidden');
      }
      updateTripField('mode', mode);
    }

    function syncFormWithCurrentTrip() {
      const trip = getCurrentTrip();
      if (!trip) return;

      document.getElementById('modeSelect').value = trip.mode || 'single';
      document.getElementById('expTypeSelect').value = trip.expType || 'first';
      toggleTripMode(trip.mode || 'single');

      document.getElementById('destInput').value = trip.destination || '';
      document.getElementById('hotelInput').value = trip.hotel || '';
      document.getElementById('airportInput').value = trip.airport || '';
      document.getElementById('returnAirportInput').value = trip.returnAirport || '';
      document.getElementById('startDate').value = trip.startDate || '';
      document.getElementById('startTime').value = trip.startTime || '12:30';
      document.getElementById('endDate').value = trip.endDate || '';
      document.getElementById('endTime').value = trip.endTime || '17:25';
      document.getElementById('interestsInput').value = trip.interests || '';

      const bookedCont = document.getElementById('bookedEventsList');
      bookedCont.innerHTML = '';
      if (trip.fixedEvents && trip.fixedEvents.length > 0) {
        trip.fixedEvents.forEach(ev => addBookedEventInput(ev.day, ev.time, ev.title));
      }

      document.getElementById('tripTitle').innerText = trip.destination ? `Viaggio a ${trip.destination}` : trip.title;
    }

    function addBookedEventInput(dateVal = '', timeVal = '', descVal = '') {
      const list = document.getElementById('bookedEventsList');
      const row = document.createElement('div');
      row.className = "flex gap-1.5 items-center bg-white p-1.5 rounded-xl border border-pastelPeach/80 text-xs";
      row.innerHTML = `
        <input type="text" placeholder="Data (es. 16/11/2026)" value="${dateVal}" class="event-day w-1/3 bg-stone-50 border border-stone-200 rounded-lg px-2 py-1 text-[11px]">
        <input type="time" value="${timeVal}" class="event-time w-1/4 bg-stone-50 border border-stone-200 rounded-lg px-1.5 py-1 text-[11px]">
        <input type="text" placeholder="Biglietto / Evento" value="${descVal}" class="event-desc flex-1 bg-stone-50 border border-stone-200 rounded-lg px-2 py-1 text-[11px]">
        <button onclick="this.parentElement.remove()" class="text-rose-400 hover:text-rose-600 font-bold px-1">✕</button>
      `;
      list.appendChild(row);
    }

    function collectFixedEvents() {
      const rows = document.querySelectorAll('#bookedEventsList > div');
      const list = [];
      rows.forEach(r => {
        const day = r.querySelector('.event-day').value.trim();
        const time = r.querySelector('.event-time').value;
        const desc = r.querySelector('.event-desc').value.trim();
        if (desc) list.push({ day: day || 'Giorno 1', time: time || 'Orario fisso', title: desc, isBooked: true });
      });
      return list;
    }

    function generateDaysArray(startDateStr, endDateStr) {
      const days = [];
      if (!startDateStr || !endDateStr) {
        return [
          { num: 1, label: "Giorno 1", dateStr: "" },
          { num: 2, label: "Giorno 2", dateStr: "" },
          { num: 3, label: "Giorno 3", dateStr: "" }
        ];
      }

      const start = new Date(startDateStr);
      const end = new Date(endDateStr);
      const diffTime = end - start;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
      const totalDays = Math.max(1, diffDays);

      const daysOfWeek = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
      const months = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];

      for (let i = 0; i < totalDays; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        const dayName = daysOfWeek[d.getDay()];
        const dayNum = d.getDate();
        const monthName = months[d.getMonth()];
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(dayNum).padStart(2, '0');

        days.push({
          num: i + 1,
          label: `Giorno ${i + 1} (${dayName} ${dayNum} ${monthName})`,
          shortDate: `${dd}/${mm}/${yyyy}`,
          isoDate: `${yyyy}-${mm}-${dd}`
        });
      }
      return days;
    }

    // Costruttore differenziato in base a expType (first vs returning)
    function buildAccurateItinerary(dest, expType, airport, hotel, sDate, sTime, eDate, eTime, fixedEvents, interests) {
      const days = generateDaysArray(sDate, eDate);
      const list = [];
      const iLow = (interests || '').toLowerCase();
      const isReturning = expType === 'returning';
      const [sh, sm] = sTime.split(':').map(Number);
      const readyH = (sh + 2) % 24;
      const readyTime = `${String(readyH).padStart(2, '0')}:${String(sm).padStart(2, '0')}`;

      days.forEach((dayObj, index) => {
        const isFirst = index === 0;
        const isLast = index === days.length - 1;

        // GIORNO 1: Arrivo
        if (isFirst) {
          list.push({
            id: `stop-${dayObj.num}-arr`,
            day: dayObj.label,
            time: `${sTime} - ${readyTime}`,
            title: `Arrivo a ${airport} ➔ Check-in a ${hotel}`,
            desc: "Transfer verso l'alloggio e deposito bagagli in hotel.",
            tag: "Transfer & Hotel",
            color: "pastelBlue",
            isTransfer: true
          });

          if (isReturning) {
            list.push({
              id: `stop-${dayObj.num}-pm`,
              day: dayObj.label,
              time: `Pomeriggio • 15:30`,
              title: "Little Venice & Passeggiata lungo Regent's Canal",
              desc: "Angolo pittoresco e tranquillo tra houseboat colorate e caffè galleggianti verso Camden.",
              tag: "Scorci Nascosti",
              color: "pastelSage"
            });
            list.push({
              id: `stop-${dayObj.num}-eve`,
              day: dayObj.label,
              time: `Sera • 19:30`,
              title: "Neal's Yard & Seven Dials in Serata",
              desc: "Cortile colorato nascosto a Covent Garden e cena in una taverna storica lontano dalla folla.",
              tag: "Atmosfera & Food",
              color: "pastelPink"
            });
          } else {
            list.push({
              id: `stop-${dayObj.num}-pm`,
              day: dayObj.label,
              time: `Pomeriggio • 15:30`,
              title: "Hyde Park, Kensington Gardens & Notting Hill",
              desc: "Passeggiata nei parchi reali fino alle casette colorate di Notting Hill.",
              tag: "Must See",
              color: "pastelSage"
            });
            list.push({
              id: `stop-${dayObj.num}-eve`,
              day: dayObj.label,
              time: `Sera • 19:30`,
              title: "Covent Garden & Luminarie Natalizie",
              desc: "Spettacoli di strada, mercato coperto illuminato e pub tradizionale.",
              tag: "Luci & Relax",
              color: "pastelPink"
            });
          }
        }

        // GIORNO 2
        else if (index === 1) {
          if (iLow.includes('sherlock')) {
            list.push({
              id: `stop-${dayObj.num}-1`,
              day: dayObj.label,
              time: "Mattina • 09:30",
              title: "Baker Street 221B & Sherlock Holmes Museum",
              desc: "Visita alla dimora del detective, statua e Daunt Books a Marylebone.",
              tag: "Sherlock",
              color: "pastelLavender"
            });
          } else {
            list.push({
              id: `stop-${dayObj.num}-1`,
              day: dayObj.label,
              time: "Mattina • 10:00",
              title: isReturning ? "Sir John Soane's Museum & Lincoln's Inn" : "British Museum",
              desc: isReturning ? "Casa-museo eclettica e labirintica ricca di antichità e curiosità segrete." : "I grandi tesori della storia mondiale e la Great Court.",
              tag: "Cultura",
              color: "pastelBlue"
            });
          }

          list.push({
            id: `stop-${dayObj.num}-2`,
            day: dayObj.label,
            time: "Pomeriggio • 14:30",
            title: isReturning ? "Leadenhall Market & St Dunstan in the East" : "Westminster Abbey & Big Ben",
            desc: isReturning ? "Giardino medievale incastonato tra le rovine di una chiesa distrutta e mercato vittoriano." : "La classica cartolina londinese lungo il Tamigi.",
            tag: isReturning ? "Chicche Nascoste" : "Icone di Londra",
            color: "pastelPeach"
          });
        }

        // GIORNO 3
        else if (index === 2) {
          if (iLow.includes('harry potter')) {
            list.push({
              id: `stop-${dayObj.num}-1`,
              day: dayObj.label,
              time: "Mattina • 09:00",
              title: "King's Cross Station & Platform 9 ¾",
              desc: "Foto con la sciarpa al carrello e visita al negozio ufficiale.",
              tag: "Harry Potter",
              color: "pastelPeach"
            });
            list.push({
              id: `stop-${dayObj.num}-2`,
              day: dayObj.label,
              time: "Pomeriggio • 16:30",
              title: isReturning ? "Cecil Court & Godwin's Court" : "Millennium Bridge & Borough Market",
              desc: isReturning ? "Stretti vicoli edoardiani a lume di gas ispirazione autentica per Diagon Alley." : "Ponte pedonale sul Tamigi e street food.",
              tag: "Harry Potter & Chicche",
              color: "pastelLavender"
            });
          } else {
            list.push({
              id: `stop-${dayObj.num}-1`,
              day: dayObj.label,
              time: "Intera Giornata",
              title: isReturning ? "Greenwich & Mercatino Vintage" : "Tower of London & Tower Bridge",
              desc: isReturning ? "Osservatorio, meridiano zero e mercato coperto vintage." : "I gioielli della corona e la fortezza medievale.",
              tag: "Scoperta",
              color: "pastelSage"
            });
          }
        }

        // GIORNO 4
        else if (index === 3) {
          list.push({
            id: `stop-${dayObj.num}-1`,
            day: dayObj.label,
            time: "Mattina • 10:00",
            title: isReturning ? "Hampstead Village & Pergola" : "Buckingham Palace & St James's Park",
            desc: isReturning ? "Atmosfera da borgo di campagna inglese, stradine acciottolate e vista panoramica." : "Cambio della guardia e passeggiata nel parco reale.",
            tag: isReturning ? "Pittoresco" : "Reale",
            color: "pastelSage"
          });
          list.push({
            id: `stop-${dayObj.num}-2`,
            day: dayObj.label,
            time: "Pomeriggio • 15:00",
            title: isReturning ? "Camden Passage (Islington) & Negozi Vintage" : "Regent Street, Carnaby & Oxford Street",
            desc: isReturning ? "Vicolo pedonale appartato celebre per antiquariato, boutique e tè pomeridiano." : "Shopping londinese e grandi vetrine illuminate.",
            tag: "Shopping & Relax",
            color: "pastelLavender"
          });
        }

        // ULTIMO GIORNO
        else if (isLast) {
          list.push({
            id: `stop-${dayObj.num}-am`,
            day: dayObj.label,
            time: "Mattina • 10:00",
            title: isReturning ? "Borough Yards & Southwark Cathedral" : "Tower Bridge & Southbank",
            desc: isReturning ? "Nuovi scorci recuperati sotto le arcate della ferrovia e street food locale." : "Ultime foto panoramiche prima del rientro.",
            tag: "Gourmet & Vista",
            color: "pastelPeach"
          });

          const [eh, em] = eTime.split(':').map(Number);
          const leaveH = (eh - 3 + 24) % 24;
          const leaveTime = `${String(leaveH).padStart(2, '0')}:${String(em).padStart(2, '0')}`;

          list.push({
            id: `stop-${dayObj.num}-tr`,
            day: dayObj.label,
            time: `Dalle ore ${leaveTime}`,
            title: `Ritiro Bagagli ➔ Transfer verso ${airport}`,
            desc: `Rientro in hotel per i bagagli e transfer per il volo delle ${eTime}.`,
            tag: "Rientro",
            color: "pastelBlue",
            isTransfer: true
          });
        }
      });

      // Match eventi prenotati
      fixedEvents.forEach(ev => {
        let assignedDayLabel = days[0].label;
        const matched = days.find(d => 
          (ev.day && (ev.day.includes(d.shortDate) || ev.day.includes(d.isoDate) || ev.day.includes(`Giorno ${d.num}`)))
        );
        if (matched) assignedDayLabel = matched.label;

        list.push({
          id: "fix-" + Math.random(),
          day: assignedDayLabel,
          time: `Ore ${ev.time} (Fissato)`,
          title: ev.title,
          desc: "🎟️ Biglietto / Evento confermato con orario vincolante.",
          tag: "Prenotato",
          color: "pastelPink",
          isBooked: true
        });
      });

      return list;
    }

    async function requestItineraryProposal() {
      const trip = getCurrentTrip();
      if (!trip) return;

      const dest = document.getElementById('destInput').value.trim() || 'Londra';
      const expType = document.getElementById('expTypeSelect').value || 'first';
      const hotel = document.getElementById('hotelInput').value.trim() || 'Hotel';
      const airport = document.getElementById('airportInput').value.trim() || 'Aeroporto';
      const sDate = document.getElementById('startDate').value;
      const sTime = document.getElementById('startTime').value || '12:30';
      const eDate = document.getElementById('endDate').value;
      const eTime = document.getElementById('endTime').value || '17:25';
      const interests = document.getElementById('interestsInput').value.trim();
      const fixedEvents = collectFixedEvents();

      trip.destination = dest;
      trip.expType = expType;
      trip.hotel = hotel;
      trip.airport = airport;
      trip.startDate = sDate;
      trip.startTime = sTime;
      trip.endDate = eDate;
      trip.endTime = eTime;
      trip.interests = interests;
      trip.fixedEvents = fixedEvents;
      trip.title = `Viaggio a ${dest}`;

      pendingProposal = buildAccurateItinerary(dest, expType, airport, hotel, sDate, sTime, eDate, eTime, fixedEvents, interests);
      
      renderProposalList();
      showProposalModal();
    }

    function renderProposalList() {
      const listCont = document.getElementById('proposalList');
      listCont.innerHTML = '';
      const uniqueDays = Array.from(new Set(pendingProposal.map(p => p.day)));

      pendingProposal.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = "p-2.5 rounded-xl bg-stone-50 border border-stone-200 text-xs flex justify-between items-center gap-2";
        let dayOptions = uniqueDays.map(d => `<option value="${d}" ${item.day === d ? 'selected' : ''}>${d}</option>`).join('');

        let badge = `<span class="bg-${item.color || 'pastelSage'} px-2 py-0.5 rounded-md font-semibold text-stone-700 text-[10px]">${item.tag}</span>`;
        if (item.isBooked) badge = `<span class="bg-pastelPink font-bold text-stone-800 px-2 py-0.5 rounded-md text-[10px]">🎟️ Prenotato</span>`;
        if (item.isTransfer) badge = `<span class="bg-pastelBlue font-semibold text-stone-800 px-2 py-0.5 rounded-md text-[10px]">🚆 Transfer</span>`;

        row.innerHTML = `
          <div class="flex-1 space-y-0.5">
            <div class="flex items-center gap-1.5">
              <select onchange="changeProposalDay(${index}, this.value)" class="bg-white border border-stone-300 rounded-md px-1.5 py-0.5 text-[10px] font-bold">
                ${dayOptions}
              </select>
              <span class="font-semibold text-stone-400 text-[10px]">${item.time}</span>
              ${badge}
            </div>
            <div class="font-bold text-stone-800 text-xs">${item.title}</div>
            <div class="text-stone-500 text-[11px]">${item.desc}</div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="moveProposalItem(${index}, -1)" class="bg-white border p-1 rounded-md text-[10px]">⬆️</button>
            <button onclick="moveProposalItem(${index}, 1)" class="bg-white border p-1 rounded-md text-[10px]">⬇️</button>
            <button onclick="removeProposalItem(${index})" class="bg-white border text-rose-500 font-bold px-1.5 py-0.5 rounded-md text-[10px]">✕</button>
          </div>
        `;
        listCont.appendChild(row);
      });
    }

    function showProposalModal() {
      document.getElementById('reviewModal').classList.remove('hidden');
    }

    function changeProposalDay(index, newDay) {
      pendingProposal[index].day = newDay;
      renderProposalList();
    }

    function moveProposalItem(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex >= 0 && targetIndex < pendingProposal.length) {
        const temp = pendingProposal[index];
        pendingProposal[index] = pendingProposal[targetIndex];
        pendingProposal[targetIndex] = temp;
        renderProposalList();
      }
    }

    function removeProposalItem(index) {
      pendingProposal.splice(index, 1);
      renderProposalList();
    }

    function swapProposalDaysPrompt() {
      const dayA = prompt("Quale giorno vuoi scambiare?", "Giorno 1");
      if (!dayA) return;
      const dayB = prompt(`Con quale altro giorno vuoi scambiare?`, "Giorno 2");
      if (!dayB) return;

      pendingProposal.forEach(item => {
        if (item.day.includes(dayA)) item.day = item.day.replace(dayA, "__TEMP__");
      });
      pendingProposal.forEach(item => {
        if (item.day.includes(dayB)) item.day = item.day.replace(dayB, dayA);
      });
      pendingProposal.forEach(item => {
        if (item.day.includes("__TEMP__")) item.day = item.day.replace("__TEMP__", dayB);
      });

      renderProposalList();
    }

    function confirmProposal() {
      const trip = getCurrentTrip();
      if (!trip) return;
      trip.stops = [...pendingProposal];
      saveAllTripsToStorage();
      document.getElementById('reviewModal').classList.add('hidden');
      renderItinerary();
    }

    function cancelProposal() {
      document.getElementById('reviewModal').classList.add('hidden');
    }

    function renderItinerary() {
      const trip = getCurrentTrip();
      if (!trip) return;

      const container = document.getElementById('itineraryContainer');
      container.innerHTML = '';

      if (!trip.stops || trip.stops.length === 0) {
        container.innerHTML = `
          <div class="bg-white/80 p-8 rounded-3xl text-center space-y-2 border border-dashed border-pastelSage">
            <p class="text-stone-600 font-semibold text-sm">Nessuna tappa inserita in questo viaggio 🌸</p>
            <p class="text-xs text-stone-400">Clicca su "Ricalcola Itinerario & Tappe" per iniziare.</p>
          </div>
        `;
        return;
      }

      const daysMap = {};
      trip.stops.forEach(stop => {
        const d = stop.day || "Generale";
        if (!daysMap[d]) daysMap[d] = [];
        daysMap[d].push(stop);
      });

      for (const [dayName, stops] of Object.entries(daysMap)) {
        const dayHeader = document.createElement('div');
        dayHeader.className = "pt-3 pb-1 flex items-center gap-2";
        dayHeader.innerHTML = `<span class="h-2.5 w-2.5 rounded-full bg-pastelPink"></span><h3 class="text-xs font-bold uppercase tracking-wider text-stone-600">${dayName}</h3>`;
        container.appendChild(dayHeader);

        stops.forEach((stop) => {
          const originalIndex = trip.stops.findIndex(s => s.id === stop.id);
          const card = document.createElement('div');
          card.className = "print-card bg-white border border-stone-100 p-3.5 rounded-2xl shadow-2xs space-y-1 transition";
          
          let badge = `<span class="bg-${stop.color || 'pastelSage'} px-2.5 py-0.5 rounded-full font-semibold text-stone-700 text-[10px]">${stop.tag || 'Tappa'}</span>`;
          if (stop.isBooked) badge = `<span class="bg-pastelPink text-stone-800 px-2.5 py-0.5 rounded-full font-bold text-[10px]">🎟️ Prenotato</span>`;
          if (stop.isTransfer) badge = `<span class="bg-pastelBlue text-stone-800 px-2.5 py-0.5 rounded-full font-semibold text-[10px]">🚆 Transfer</span>`;

          card.innerHTML = `
            <div class="flex justify-between items-center text-xs">
              <span class="font-semibold text-stone-400 uppercase tracking-wide text-[10px]">${stop.time}</span>
              ${badge}
            </div>
            <h4 class="font-bold text-stone-800 text-sm leading-snug">${stop.title}</h4>
            <p class="text-xs text-stone-600 leading-relaxed">${stop.desc}</p>
            <div class="no-print flex justify-end gap-2.5 pt-1.5 border-t border-stone-50 text-[11px]">
              <button onclick="editStop(${originalIndex})" class="text-stone-500 hover:text-stone-800 font-semibold">✏️ Modifica</button>
              <button onclick="deleteStop(${originalIndex})" class="text-rose-400 hover:text-rose-600 font-semibold">🗑️ Elimina</button>
            </div>
          `;
          container.appendChild(card);
        });
      }
    }

    function shareTrip() {
      const current = getCurrentTrip();
      if (!current) return;
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(current))));
      const shareUrl = window.location.origin + window.location.pathname + '?trip=' + encoded;
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert(`✨ Link del viaggio a "${current.destination}" copiato negli appunti!`);
      }).catch(() => {
        prompt("Copia questo link:", shareUrl);
      });
    }

    function addNewStopPrompt() {
      const trip = getCurrentTrip();
      if (!trip) return;
      const day = prompt("Giorno (es. Giorno 1):", "Giorno 1");
      if (!day) return;
      const time = prompt("Orario / Fascia:", "Pomeriggio • 15:00");
      const title = prompt("Nome Luogo / Attività:");
      if (!title) return;
      const desc = prompt("Descrizione / Note:");
      const tag = prompt("Tag tematico:", "Visita");

      trip.stops.push({
        id: "stop-" + Date.now(),
        day: day,
        time: time || "Orario libero",
        title: title,
        desc: desc || "",
        tag: tag || "Tappa",
        color: "pastelSage",
        isBooked: false
      });
      saveAllTripsToStorage();
      renderItinerary();
    }

    function editStop(index) {
      const trip = getCurrentTrip();
      if (!trip) return;
      const stop = trip.stops[index];
      const newTitle = prompt("Modifica titolo:", stop.title);
      if (newTitle !== null) stop.title = newTitle;
      const newDesc = prompt("Modifica note:", stop.desc);
      if (newDesc !== null) stop.desc = newDesc;
      const newTime = prompt("Modifica orario:", stop.time);
      if (newTime !== null) stop.time = newTime;
      saveAllTripsToStorage();
      renderItinerary();
    }

    function deleteStop(index) {
      const trip = getCurrentTrip();
      if (!trip) return;
      if (confirm("Rimuovere questa tappa?")) {
        trip.stops.splice(index, 1);
        saveAllTripsToStorage();
        renderItinerary();
      }
    }

    function exportPDF() {
      window.print();
    }
  </script>
</body>
